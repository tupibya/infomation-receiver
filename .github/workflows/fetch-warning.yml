name: Fetch JMA Warning

on:
  schedule:
    - cron: "*/10 * * * *"   # 10分ごとに更新
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Fetch JMA Warning JSON
        run: |
          mkdir -p data
          # 都道府県コード一覧
          codes="010000 020000 030000 040000 050000 060000 070000 080000 090000 100000 110000 120000 130000 140000 150000 160000 170000 180000 190000 200000 210000 220000 230000 240000 250000 260000 270000 280000 290000 300000 310000 320000 330000 340000 350000 360000 370000 380000 390000 400000 410000 420000 430000 440000 450000 460000 470000"

          for code in $codes; do
            curl -s -o data/${code}.json https://www.jma.go.jp/bosai/warning/data/warning/${code}.json
          done

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/*.json
          git commit -m "Update warning JSON" || echo "No changes"
          git push
