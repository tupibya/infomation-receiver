<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>全国気象警報受信機（気象庁API）</title>

<style>
  body {
    background:#111;
    color:#fff;
    font-family:system-ui, sans-serif;
    padding:20px;
  }
  h1 {
    text-align:center;
    margin-bottom:20px;
  }
  #prefSelector {
    width:100%;
    padding:10px;
    margin-bottom:20px;
    border-radius:8px;
    background:#1e1e1e;
    color:#fff;
    border:none;
  }
  #warnings {
    display:grid;
    gap:12px;
  }
  .card {
    background:#1e1e1e;
    padding:15px;
    border-radius:8px;
    border-left:5px solid #4caf50;
  }
  .warn {
    border-left-color:#ff3b3b;
  }
  .adv {
    border-left-color:#ffcc00;
  }
</style>
</head>

<body>
<h1>全国気象警報受信機（気象庁API）</h1>

<select id="prefSelector"></select>
<div id="warnings"></div>

<script>
// 都道府県コード一覧（気象庁API）
const PREFS = {
  "北海道": "010000","青森県": "020000","岩手県": "030000","宮城県": "040000",
  "秋田県": "050000","山形県": "060000","福島県": "070000","茨城県": "080000",
  "栃木県": "090000","群馬県": "100000","埼玉県": "110000","千葉県": "120000",
  "東京都": "130000","神奈川県": "140000","新潟県": "150000","富山県": "160000",
  "石川県": "170000","福井県": "180000","山梨県": "190000","長野県": "200000",
  "岐阜県": "210000","静岡県": "220000","愛知県": "230000","三重県": "240000",
  "滋賀県": "250000","京都府": "260000","大阪府": "270000","兵庫県": "280000",
  "奈良県": "290000","和歌山県": "300000","鳥取県": "310000","島根県": "320000",
  "岡山県": "330000","広島県": "340000","山口県": "350000","徳島県": "360000",
  "香川県": "370000","愛媛県": "380000","高知県": "390000","福岡県": "400000",
  "佐賀県": "410000","長崎県": "420000","熊本県": "430000","大分県": "440000",
  "宮崎県": "450000","鹿児島県": "460000","沖縄県": "470000"
};

const selector = document.getElementById("prefSelector");
const container = document.getElementById("warnings");

// セレクタ生成
Object.keys(PREFS).forEach(pref => {
  const opt = document.createElement("option");
  opt.value = PREFS[pref];
  opt.textContent = pref;
  selector.appendChild(opt);
});

// 初期は埼玉県
selector.value = PREFS["埼玉県"];

async function loadWarnings() {
  const code = selector.value;
  const prefName = selector.options[selector.selectedIndex].textContent;
  const url = `https://www.jma.go.jp/bosai/warning/data/warning/${code}.json`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    const warnings = data.warning[0].warnings;
    container.innerHTML = "";

    warnings.forEach(w => {
      const div = document.createElement("div");
      const isWarn = w.headline.includes("警報");
      const isAdv  = w.headline.includes("注意報");

      div.className = "card " + (isWarn ? "warn" : isAdv ? "adv" : "");
      div.innerHTML = `
        <h2>${w.headline}</h2>
        <p>都道府県: ${prefName}</p>
        <p>状態: ${w.status}</p>
        <p>コード: ${w.code}</p>
      `;
      container.appendChild(div);
    });

  } catch (e) {
    container.innerHTML =
      "<p>取得エラー：HTTP/HTTPSで開いてください。</p>";
  }
}

// 県変更時に更新
selector.addEventListener("change", loadWarnings);

// 30秒ごとに自動更新（平常時用）
setInterval(loadWarnings, 30000);

// 指定時刻（0,3,9,12,15,18,21時）で更新
let lastTrigger = "";
setInterval(() => {
  const now = new Date();
  const hh = now.getHours();
  const mm = now.getMinutes();
  const current = `${hh}:${mm}`;

  const targets = ["0:0","3:0","9:0","12:0","15:0","18:0","21:0"];

  if (targets.includes(current) && lastTrigger !== current) {
    console.log("定時更新:", current);
    loadWarnings();
    lastTrigger = current;
  }

  // 分が変わったらフラグリセット
  const lastMin = lastTrigger.split(":")[1];
  if (lastMin && Number(lastMin) !== mm) {
    lastTrigger = "";
  }
}, 1000);

// 初回読み込み
loadWarnings();
</script>

</body>
</html>
