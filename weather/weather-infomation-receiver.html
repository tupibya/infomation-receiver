<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>気象警報テスト表示</title>

<style>
  body { background:#111; color:#fff; font-family:system-ui; padding:20px; }
  h1 { text-align:center; margin-bottom:20px; }
  .card {
    background:#1e1e1e;
    padding:15px;
    margin-bottom:10px;
    border-radius:8px;
    border-left:5px solid #ffcc00;
  }
  .warn { border-left-color:#ff3b3b; }
  .adv { border-left-color:#ffcc00; }
</style>
</head>

<body>
<h1>静岡県の気象警報</h1>
<div id="warnings"></div>

<script>
async function loadWarnings() {
  const url = "https://www.jma.go.jp/bosai/warning/data/warning/220000.json";

  const res = await fetch(url);
  const data = await res.json();

  const list = data.warning[0].warnings;  // ← ここに警報一覧が入ってる
  const container = document.getElementById("warnings");
  container.innerHTML = "";

  list.forEach(w => {
    const div = document.createElement("div");

    const isWarn = w.headline.includes("警報");
    const isAdv  = w.headline.includes("注意報");

    div.className = "card " + (isWarn ? "warn" : isAdv ? "adv" : "");

    div.innerHTML = `
      <h2>${w.headline}</h2>
      <p>状態: ${w.status}</p>
      <p>コード: ${w.code}</p>
    `;

    container.appendChild(div);
  });
}

loadWarnings();
</script>

</body>
</html>
