<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>全国気象警報受信機</title>

<style>
  body {
    font-family: "Inter", sans-serif;
    background: #121212;
    color: #fff;
    padding: 20px;
  }
  h1 {
    text-align: center;
    margin-bottom: 10px;
  }
  #prefSelector {
    width: 100%;
    padding: 10px;
    margin-bottom: 20px;
    border-radius: 8px;
    background: #1e1e1e;
    color: #fff;
    border: none;
  }
  #warnings {
    display: grid;
    gap: 15px;
  }
  .card {
    background: #1e1e1e;
    padding: 15px;
    border-radius: 10px;
    border-left: 5px solid #ffcc00;
  }
  .card h2 {
    margin: 0 0 10px;
    font-size: 20px;
  }
  .card p {
    margin: 0;
    opacity: 0.8;
  }
</style>
</head>

<body>
<h1>全国気象警報受信機</h1>

<select id="prefSelector"></select>
<div id="warnings"></div>

<script>
const PREFS = {
  "北海道": "010000", "青森県": "020000", "岩手県": "030000", "宮城県": "040000",
  "秋田県": "050000", "山形県": "060000", "福島県": "070000", "茨城県": "080000",
  "栃木県": "090000", "群馬県": "100000", "埼玉県": "110000", "千葉県": "120000",
  "東京都": "130000", "神奈川県": "140000", "新潟県": "150000", "富山県": "160000",
  "石川県": "170000", "福井県": "180000", "山梨県": "190000", "長野県": "200000",
  "岐阜県": "210000", "静岡県": "220000", "愛知県": "230000", "三重県": "240000",
  "滋賀県": "250000", "京都府": "260000", "大阪府": "270000", "兵庫県": "280000",
  "奈良県": "290000", "和歌山県": "300000", "鳥取県": "310000", "島根県": "320000",
  "岡山県": "330000", "広島県": "340000", "山口県": "350000", "徳島県": "360000",
  "香川県": "370000", "愛媛県": "380000", "高知県": "390000", "福岡県": "400000",
  "佐賀県": "410000", "長崎県": "420000", "熊本県": "430000", "大分県": "440000",
  "宮崎県": "450000", "鹿児島県": "460000", "沖縄県": "470000"
};

let lastWarningsText = ""; // 読み上げの重複防止

// 県リストを生成
const selector = document.getElementById("prefSelector");
Object.keys(PREFS).forEach(pref => {
  const opt = document.createElement("option");
  opt.value = PREFS[pref];
  opt.textContent = pref;
  selector.appendChild(opt);
});

// 初期表示：埼玉県（ユーザーの現在地）
selector.value = PREFS["埼玉県"];

async function loadWarnings() {
  const code = selector.value;
  const url = `https://www.jma.go.jp/bosai/warning/data/warning/${code}.json`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    const areaWarnings = data.warning[0].warnings;
    const container = document.getElementById("warnings");
    container.innerHTML = "";

    let textToSpeak = "";

    areaWarnings.forEach(w => {
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <h2>${w.headline}</h2>
        <p>種別コード: ${w.code}</p>
        <p>発表状態: ${w.status}</p>
      `;

      container.appendChild(card);

      // 読み上げ用テキスト
      textToSpeak += `${w.headline}、`;
    });

    // 新しい警報が出たら読み上げ
    if (textToSpeak && textToSpeak !== lastWarningsText) {
      speechSynthesis.speak(new SpeechSynthesisUtterance(textToSpeak));
      lastWarningsText = textToSpeak;
    }

  } catch (e) {
    console.error("警報取得エラー:", e);
  }
}

// 県変更時に自動更新
selector.addEventListener("change", loadWarnings);

// 初回読み込み
loadWarnings();

// 30秒ごとに自動更新
setInterval(loadWarnings, 30000);
</script>

</body>
</html>
